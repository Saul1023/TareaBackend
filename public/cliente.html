<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Cliente</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    label {
      font-size: 1.1em;
      margin-bottom: 8px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.2em;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;
      font-size: 1.1em;
      text-align: center;
    }

    .error {
      background-color: #f44336;
    }

    .success {
      background-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registrar Cliente</h1>
    <form id="clienteForm">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="edad">Edad:</label>
      <input type="text" id="edad" name="edad" required min="0">

      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="telefono">Teléfono:</label>
      <input type="text" id="telefono" name="telefono">

      <label for="direccion">Dirección:</label>
      <textarea id="direccion" name="direccion" rows="3"></textarea>

      <button type="submit">Registrar</button>
    </form>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    document.getElementById('clienteForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const data = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        edad: parseInt(document.getElementById('edad').value),
        correo: document.getElementById('correo').value,
        telefono: document.getElementById('telefono').value || null,
        direccion: document.getElementById('direccion').value || null
      };

      try {
        const response = await fetch('http://localhost:3000/cliente', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        const notification = document.getElementById('notification');

        if (response.ok) {
          notification.innerText = 'Cliente registrado correctamente';
          notification.classList.remove('error');
          notification.classList.add('success');
        } else {
          notification.innerText = 'No se pudo registrar el cliente: ' + (result.message || 'Error desconocido');
          notification.classList.remove('success');
          notification.classList.add('error');
        }
        notification.style.display = 'block';
        setTimeout(() => notification.style.display = 'none', 5000);

      } catch (error) {
        const notification = document.getElementById('notification');
        notification.innerText = 'Error al conectar con el servidor';
        notification.classList.remove('success');
        notification.classList.add('error');
        notification.style.display = 'block';
        setTimeout(() => notification.style.display = 'none', 5000);
      }
    });
  </script>
</body>
</html>
