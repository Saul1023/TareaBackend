<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Persona</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    label {
      font-size: 1.1em;
      margin-bottom: 8px;
      display: block;
    }

    input[type="text"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.2em;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    /* Estilo de la notificación */
    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;  /* Ocultar por defecto */
      font-size: 1.1em;
      text-align: center;
    }

    .error {
      background-color: #f44336;
    }

    .success {
      background-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registrar Persona</h1>
    <form id="personaForm">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required><br>
      
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required><br>
      
      <label for="edad">Edad:</label>
      <input type="text" id="edad" name="edad" required min="0" step="1"><br>
      
      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" required><br>
      
      <button type="submit">Registrar</button>
    </form>
  </div>

  <!-- Notificación -->
  <div id="notification" class="notification"></div>

  <script>
    document.getElementById('personaForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const data = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        edad: parseInt(document.getElementById('edad').value),  // Convertir a número entero
        correo: document.getElementById('correo').value
      };

      try {
        const response = await fetch('http://localhost:3000/persona', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        const notification = document.getElementById('notification');
        
        if (response.ok) {
          notification.innerText = 'Usuario registrado correctamente';
          notification.classList.remove('error');
          notification.classList.add('success');
        } else {
          notification.innerText = 'No se pudo crear el usuario: ' + result.message;
          notification.classList.remove('success');
          notification.classList.add('error');
        }

        // Mostrar notificación
        notification.style.display = 'block';

        // Ocultar la notificación después de 5 segundos
        setTimeout(function() {
          notification.style.display = 'none';
        }, 5000);

      } catch (error) {
        const notification = document.getElementById('notification');
        notification.innerText = 'Error al conectar con el servidor';
        notification.classList.remove('success');
        notification.classList.add('error');
        notification.style.display = 'block';

        setTimeout(function() {
          notification.style.display = 'none';
        }, 5000);
      }
    });
  </script>
</body>
</html>
