<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Vehículo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    label {
      font-size: 1.1em;
      margin-bottom: 8px;
      display: block;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.2em;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    /* Estilo de la notificación */
    .notification {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;  /* Ocultar por defecto */
      font-size: 1.1em;
      text-align: center;
    }

    .error {
      background-color: #f44336;
    }

    .success {
      background-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registrar Vehículo</h1>
    <form id="vehiculoForm">
      <label for="marca">Marca:</label>
      <input type="text" id="marca" name="marca" required><br>
      
      <label for="modelo">Modelo:</label>
      <input type="text" id="modelo" name="modelo" required><br>
      
      <label for="anio">Año:</label>
      <input type="text" id="anio" name="anio" required min="1900" max="2100"><br>
      
      <label for="color">Color:</label>
      <input type="text" id="color" name="color"><br>
      
      <label for="placa">Placa:</label>
      <input type="text" id="placa" name="placa"><br>
      
      <button type="submit">Registrar</button>
    </form>
  </div>

  <!-- Notificación -->
  <div id="notification" class="notification"></div>

  <script>
    document.getElementById('vehiculoForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const data = {
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        anio: parseInt(document.getElementById('anio').value),
        color: document.getElementById('color').value,
        placa: document.getElementById('placa').value
      };

      try {
        const response = await fetch('http://localhost:3000/vehiculo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        const notification = document.getElementById('notification');
        
        if (response.ok) {
          notification.innerText = 'Vehículo registrado correctamente';
          notification.classList.remove('error');
          notification.classList.add('success');
        } else {
          notification.innerText = 'No se pudo registrar el vehículo: ' + result.message;
          notification.classList.remove('success');
          notification.classList.add('error');
        }
        notification.style.display = 'block';
        setTimeout(function() {
          notification.style.display = 'none';
        }, 5000);

      } catch (error) {
        const notification = document.getElementById('notification');
        notification.innerText = 'Error al conectar con el servidor';
        notification.classList.remove('success');
        notification.classList.add('error');
        notification.style.display = 'block';

        setTimeout(function() {
          notification.style.display = 'none';
        }, 5000);
      }
    });
  </script>
</body>
</html>
